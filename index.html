<!DOCTYPE html>
<html>
<head>
<title>Task Manager</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h2 {
  margin-top: 20px;
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #0056b3;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  background: #f1f1f1;
  margin: 5px 0;
  padding: 10px;
  border-radius: 5px;
}
</style>

</head>

<body>

<div class="container">

<h2>Signup</h2>
<input id="sEmail" placeholder="Email">
<input id="sPass" placeholder="Password">
<select id="role">
<option value="admin">admin</option>
<option value="member">member</option>
</select>
<button onclick="signup()">Signup</button>

<h2>Login</h2>
<input id="lEmail" placeholder="Email">
<input id="lPass" placeholder="Password">
<button onclick="login()">Login</button>

<h2>Create Project</h2>
<input id="pName" placeholder="Project Name">
<button onclick="createProject()">Create Project</button>

<h2>Create Task</h2>
<input id="tTitle" placeholder="Task Title">

<select id="status">
  <option value="Pending">Pending</option>
  <option value="Done">Done</option>
</select>

<input id="assign" placeholder="Assign to (email)">
<button onclick="createTask()">Create Task</button>

<h2>Dashboard</h2>
<button onclick="load()">Load Tasks</button>
<ul id="list"></ul>

</div>

<script>

const API = "http://localhost:5000";

function signup(){
 fetch(API+"/signup",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    email: document.getElementById("sEmail").value,
    password: document.getElementById("sPass").value,
    role: document.getElementById("role").value
  })
 });
 alert("Signup done");
}

function login(){
 fetch(API+"/login",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    email: document.getElementById("lEmail").value,
    password: document.getElementById("lPass").value
  })
 }).then(r=>r.json())
   .then(d=>alert("Login success"));
}

function createProject(){
 fetch(API+"/project",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    name: document.getElementById("pName").value
  })
 });
 alert("Project created");
}

function createTask(){
 const title = document.getElementById("tTitle").value;
 const status = document.getElementById("status").value;
 const assignedTo = document.getElementById("assign").value;

 fetch(API+"/task",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    title: title,
    status: status,
    assignedTo: assignedTo
  })
 })
 .then(res => res.json())
 .then(data => {
   alert("Task created");
   console.log(data);
 });
}


function load(){
 fetch(API+"/tasks")
 .then(r=>r.json())
 .then(data=>{
  const list = document.getElementById("list");
  list.innerHTML="";

  data.forEach(t=>{
    list.innerHTML += `
      <li>
        <b>${t.title}</b><br>
        Status: ${t.status || "N/A"}<br>
        Assigned: ${t.assignedTo || "N/A"}
      </li>
    `;
  });
 });
}

</script>

</body>
</html>
